name: Shining Saturn 360 - Xenon audit and build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - 'src/**'
      - 'source/**'
      - 'Makefile'
      - 'makefile'
      - '.github/workflows/xenon-build.yml'

permissions:
  contents: read

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    outputs:
      has_makefile: ${{ steps.inspect.outputs.has_makefile }}
      selected_archive: ${{ steps.inspect.outputs.selected_archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and extract source archives
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, zipfile
          archives = sorted(glob.glob("*.zip"))
          os.makedirs("prepared-source", exist_ok=True)
          best = None
          report = []
          for path in archives:
              try:
                  with zipfile.ZipFile(path) as z:
                      bad = z.testzip()
                      names = z.namelist()
                      makefiles = [n for n in names if n.rstrip("/").split("/")[-1].lower() == "makefile"]
                      sources = [n for n in names if n.lower().endswith((".c",".cc",".cpp",".cxx",".h",".hpp",".s",".asm"))]
                      report.append(f"- **{path}**: integrity={'OK' if bad is None else 'FAILED: '+bad}; entries={len(names)}; makefiles={len(makefiles)}; source_files={len(sources)}")
                      score = (len(makefiles) > 0, len(sources), len(names))
                      if best is None or score > best[0]:
                          best = (score, path, makefiles, sources)
              except Exception as exc:
                  report.append(f"- **{path}**: inspection failed: {exc!r}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Source archive audit\n" + ("\n".join(report) if report else "No ZIP archives found.") + "\n")
          if best is not None:
              _, path, makefiles, sources = best
              print(f"Selected archive: {path}; Makefiles: {makefiles[:10]}; source files: {len(sources)}")
              with zipfile.ZipFile(path) as z:
                  # Reject paths escaping the extraction directory.
                  root = os.path.realpath("prepared-source")
                  for member in z.infolist():
                      target = os.path.realpath(os.path.join(root, member.filename))
                      if target != root and not target.startswith(root + os.sep):
                          raise RuntimeError(f"Unsafe ZIP path: {member.filename}")
                  z.extractall(root)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"selected_archive={path}\n")
                  f.write(f"has_makefile={'true' if any(os.path.isfile(os.path.join(root, p)) for p in ('Makefile','makefile')) else 'false'}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"\nSelected archive: `{path}`. Root Makefile extracted: {'yes' if any(os.path.isfile(os.path.join(root, p)) for p in ('Makefile','makefile')) else 'no'}.\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("selected_archive=none\nhas_makefile=false\n")
          PY

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-prepared-source
          path: prepared-source/
          if-no-files-found: error
          retention-days: 7

  build-xenon:
    needs: prepare-source
    if: needs.prepare-source.outputs.has_makefile == 'true'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    steps:
      - name: Download extracted source
        uses: actions/download-artifact@v4
        with:
          name: ShiningSaturn360-prepared-source
          path: .

      - name: Locate Xenon tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/xenon/bin:/usr/local/xenon/usr/bin:/opt/xenon/bin:/opt/xenon/usr/bin:$PATH"
          command -v xenon-gcc
          command -v xenon-g++
          command -v xenon-ld
          find /usr/local /opt -type f \( -name elf2xex -o -name 'elf2xex*' \) -print 2>/dev/null || true
          if ! command -v elf2xex >/dev/null 2>&1; then
            echo "::error::elf2xex is not present in the libxenon container; cannot package default.xex."
            exit 1
          fi

      - name: Compile and package
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/xenon/bin:/usr/local/xenon/usr/bin:/opt/xenon/bin:/opt/xenon/usr/bin:$PATH"
          make
          test -s Xenon.elf
          elf2xex Xenon.elf default.xex
          test -s default.xex
          sha256sum Xenon.elf default.xex | tee build-sha256.txt

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-Xenon-build
          path: |
            Xenon.elf
            default.xex
            build-sha256.txt
          if-no-files-found: error
          retention-days: 14

  report-no-makefile:
    needs: prepare-source
    if: needs.prepare-source.outputs.has_makefile != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain next blocker
        shell: bash
        run: |
          {
            echo "## Build not started"
            echo "The source archives were inspected and extracted, but no Makefile was found at the extracted root. A genuine project build cannot be inferred safely without the source's actual build instructions."
            echo "The next step is to identify the source entry point and create a project-specific Makefile."
          } >> "$GITHUB_STEP_SUMMARY"
