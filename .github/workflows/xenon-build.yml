
name: Shining Saturn 360 - Xenon Build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/xenon-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xenon toolchain
        run: |
          set -eu
          command -v xenon-gcc
          command -v xenon-ld
          command -v elf2xex

      - name: Compile emulator
        run: |
          set -eu
          test -f Makefile || {
            echo "ERRO: falta o Makefile do projeto."
            exit 1
          }
          make
          test -s Xenon.elf || {
            echo "ERRO: Xenon.elf não foi produzido."
            exit 1
          }
          elf2xex Xenon.elf default.xex
          test -s default.xex

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-v0.39b
          path: |
            Xenon.elf
            default.xex
          if-no-files-found: error
          
