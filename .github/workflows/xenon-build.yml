name: Shining Saturn 360 - Xenon audit and build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - 'src/**'
      - 'source/**'
      - 'Makefile'
      - 'makefile'
      - '.github/workflows/xenon-build.yml'

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit toolchain and source archives
        id: audit
        shell: bash
        run: |
          set -u
          export PATH="/usr/local/xenon/bin:/usr/local/xenon/usr/bin:/opt/xenon/bin:/opt/xenon/usr/bin:$PATH"
          echo "## Repository inventory" >> "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 3 -type f -not -path './.git/*' -print | sort | tee /tmp/repo-files.txt
          cat /tmp/repo-files.txt >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Xenon tools" >> "$GITHUB_STEP_SUMMARY"
          for tool in xenon-gcc xenon-g++ xenon-ld elf2xex make python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf -- '- `%s`: found at `%s`\n' "$tool" "$(command -v "$tool")" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- `%s`: not found\n' "$tool" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Toolchain discovery" >> "$GITHUB_STEP_SUMMARY"
          find /usr/local /opt -type f \( -name 'xenon-gcc' -o -name 'xenon-g++' -o -name 'elf2xex' \) -print 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          if ! command -v python3 >/dev/null 2>&1; then
            echo "build_ready=false" >> "$GITHUB_OUTPUT"
            echo "Python 3 is missing; cannot safely inspect source ZIPs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Inspect ZIPs without relying on unzip, which is absent in some libxenon images.
          python3 - <<'PY' | tee /tmp/archive-audit.txt
          import glob, zipfile
          for path in sorted(glob.glob("*.zip")):
              print(f"### {path}")
              try:
                  with zipfile.ZipFile(path) as z:
                      bad = z.testzip()
                      names = z.namelist()
                      print("ZIP integrity:", "OK" if bad is None else f"FAILED at {bad}")
                      print("Entries:", len(names))
                      print("Makefiles:", [n for n in names if n.rsplit("/",1)[-1].lower() == "makefile"][:10])
                      print("Source files:", [n for n in names if n.lower().endswith((".c",".cc",".cpp",".cxx",".h",".hpp",".s"))][:30])
              except Exception as exc:
                  print("ZIP inspection failed:", repr(exc))
          PY
          cat /tmp/archive-audit.txt >> "$GITHUB_STEP_SUMMARY"

          # Build only if a Makefile is already present at repository root.
          if command -v xenon-gcc >/dev/null 2>&1 && command -v elf2xex >/dev/null 2>&1 && { [ -f Makefile ] || [ -f makefile ]; }; then
            echo "build_ready=true" >> "$GITHUB_OUTPUT"
            echo "- Build readiness: root Makefile and compiler/packager found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build_ready=false" >> "$GITHUB_OUTPUT"
            echo "- Build readiness: not ready. Root Makefile, xenon-gcc and elf2xex must all be available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compile and package Xenon executable
        if: steps.audit.outputs.build_ready == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/local/xenon/bin:/usr/local/xenon/usr/bin:/opt/xenon/bin:/opt/xenon/usr/bin:$PATH"
          make clean || true
          make
          test -s Xenon.elf
          elf2xex Xenon.elf default.xex
          test -s default.xex
          sha256sum Xenon.elf default.xex | tee build-sha256.txt

      - name: Upload build artifacts
        if: steps.audit.outputs.build_ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-Xenon-build
          path: |
            Xenon.elf
            default.xex
            build-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report audit-only result
        if: steps.audit.outputs.build_ready != 'true'
        shell: bash
        run: |
          {
            echo ""
            echo "## Result"
            echo "Audit completed without producing an executable. The ZIP report above identifies whether source files and Makefiles exist; a real build still requires a valid project Makefile plus the Xenon compiler and elf2xex."
          } >> "$GITHUB_STEP_SUMMARY"
