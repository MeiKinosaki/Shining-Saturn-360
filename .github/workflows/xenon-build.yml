name: Shining Saturn 360 - Xenon audit and build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - 'src/**'
      - 'source/**'
      - 'Makefile'
      - 'makefile'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'VERSION*'
      - '.github/workflows/xenon-build.yml'

permissions:
  contents: read

jobs:
  sh2-profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Compile and profile current SH-2 core
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-sh2-benchmark.sh | tee sh2-benchmark.txt
      - name: Upload SH-2 benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: sh2-benchmark-report
          path: sh2-benchmark.txt
          if-no-files-found: error
          retention-days: 30

  saturn-device-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Compile and run DMA, VDP1 and VDP2 host benchmarks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/run-saturn-device-benchmarks.sh
          tests/run-saturn-device-benchmarks.sh | tee saturn-device-benchmarks.txt
      - name: Upload device benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: saturn-device-benchmark-report
          path: saturn-device-benchmarks.txt
          if-no-files-found: error
          retention-days: 30

  prepare-source:
    runs-on: ubuntu-latest
    outputs:
      has_makefile: ${{ steps.inspect.outputs.has_makefile }}
      source_dir: ${{ steps.inspect.outputs.source_dir }}
      selected_archive: ${{ steps.inspect.outputs.selected_archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and extract source archives
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, zipfile
          archives = sorted(glob.glob("*.zip"))
          os.makedirs("prepared-source", exist_ok=True)
          best = None
          report = []
          for path in archives:
              try:
                  with zipfile.ZipFile(path) as z:
                      bad = z.testzip()
                      names = z.namelist()
                      makefiles = [n for n in names if n.rstrip("/").split("/")[-1].lower() == "makefile"]
                      sources = [n for n in names if n.lower().endswith((".c",".cc",".cpp",".cxx",".h",".hpp",".s",".asm"))]
                      report.append(f"- **{path}**: integrity={'OK' if bad is None else 'FAILED: '+bad}; entries={len(names)}; makefiles={len(makefiles)}; source_files={len(sources)}")
                      # Prefer an archive with source and a Makefile; then the shallowest project Makefile.
                      candidates = sorted(makefiles, key=lambda n: (n.count("/"), len(n)))
                      project_makefile = next((n for n in candidates if n.count("/") <= 1), candidates[0] if candidates else None)
                      score = (project_makefile is not None, len(sources), len(names))
                      if best is None or score > best[0]:
                          best = (score, path, project_makefile, makefiles, sources)
              except Exception as exc:
                  report.append(f"- **{path}**: inspection failed: {exc!r}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Source archive audit\n" + ("\n".join(report) if report else "No ZIP archives found.") + "\n")
          if best is not None:
              _, path, project_makefile, makefiles, sources = best
              print(f"Selected archive: {path}; project Makefile: {project_makefile}; source files: {len(sources)}")
              with zipfile.ZipFile(path) as z:
                  root = os.path.realpath("prepared-source")
                  for member in z.infolist():
                      target = os.path.realpath(os.path.join(root, member.filename))
                      if target != root and not target.startswith(root + os.sep):
                          raise RuntimeError(f"Unsafe ZIP path: {member.filename}")
                  z.extractall(root)
              source_dir = os.path.dirname(project_makefile) if project_makefile else ""
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"selected_archive={path}\n")
                  f.write(f"source_dir={source_dir}\n")
                  f.write(f"has_makefile={'true' if project_makefile else 'false'}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"\nSelected archive: `{path}`. Project directory: `{source_dir or '.'}`. Project Makefile: `{project_makefile or 'not found'}`.\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("selected_archive=none\nsource_dir=\nhas_makefile=false\n")
          PY

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-prepared-source
          path: prepared-source/
          if-no-files-found: error
          retention-days: 7

  host-regression-tests:
    needs: prepare-source
    if: needs.prepare-source.outputs.has_makefile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SH-2 core tests
        uses: actions/checkout@v4
        with:
          path: project

      - name: Compile and run SH-2 core tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x project/tests/run-sh2-core-tests.sh
          project/tests/run-sh2-core-tests.sh

      - name: Download extracted source
        uses: actions/download-artifact@v4
        with:
          name: ShiningSaturn360-prepared-source
          path: prepared-source

      - name: Run host regression tests
        shell: bash
        env:
          SOURCE_DIR: ${{ needs.prepare-source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "prepared-source/$SOURCE_DIR"
          chmod +x scripts/run-host-tests.sh
          ./scripts/run-host-tests.sh

  build-xenon-elf32:
    needs: prepare-source
    if: needs.prepare-source.outputs.has_makefile == 'true'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    steps:
      - name: Download extracted source
        uses: actions/download-artifact@v4
        with:
          name: ShiningSaturn360-prepared-source
          path: prepared-source

      - name: Configure and verify libXenon
        shell: bash
        env:
          SOURCE_DIR: ${{ needs.prepare-source.outputs.source_dir }}
        run: |
          set -euo pipefail
          export DEVKITXENON="/usr/local/xenon"
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          cd "prepared-source/$SOURCE_DIR"
          echo "DEVKITXENON=$DEVKITXENON"
          command -v xenon-gcc
          command -v xenon-g++
          command -v xenon-ld
          echo "---- libXenon app.lds ----"
          sed -n "1,240p" "$DEVKITXENON/app.lds"
          echo "---- linker variables in rules ----"
          grep -nE "app\.lds|LDFLAGS|xenon-ld|ENTRY|image-base|Ttext" "$DEVKITXENON/rules" || true
          echo "---- build-xenon Makefile ----"
          sed -n "1,220p" build-xenon/Makefile
          test -f "$DEVKITXENON/rules"
          bash ./scripts/xenon-preflight.sh

      - name: Compile ELF32
        shell: bash
        env:
          SOURCE_DIR: ${{ needs.prepare-source.outputs.source_dir }}
        run: |
          set -euxo pipefail
          export DEVKITXENON="/usr/local/xenon"
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          cd "prepared-source/$SOURCE_DIR"
          chmod +x scripts/*.sh
          bash ./scripts/xenon-preflight.sh
          # XEX PE headers occupy the first 4 KiB; leave that RVA unused.
          awk '
            /^[[:space:]]*\.[[:space:]]*=[[:space:]]*0x80000000;/ {
              sub(/0x80000000/, "0x80002000")
              base_count++
            }
            /^[[:space:]]*\.(data|sdata|bss|sbss)[[:space:]]*:/ {
              print "  . = ALIGN(0x10000) + 0x1000; /* XEX pages relative to 0x1000 image base */"
              data_count++
            }
            { print }
            END { if (base_count != 1 || data_count != 4) exit 1 }
          ' "$DEVKITXENON/app.lds" > /tmp/shining-saturn-app.lds
          grep -q "0x80002000" /tmp/shining-saturn-app.lds
          test "$(grep -c 'ALIGN(0x10000)' /tmp/shining-saturn-app.lds)" -eq 4
          grep -q "ALIGN(0x10000)" /tmp/shining-saturn-app.lds

          make -C build-xenon clean
          make -C build-xenon LDSCRIPT=/tmp/shining-saturn-app.lds
          test -s build-xenon/shining_saturn_bootstrap.elf32
          readelf -h build-xenon/shining_saturn_bootstrap.elf32 | tee build-xenon/elf-header.txt
          readelf -l build-xenon/shining_saturn_bootstrap.elf32 | tee build-xenon/elf-program-headers.txt
          readelf -S build-xenon/shining_saturn_bootstrap.elf32 | tee build-xenon/elf-section-headers.txt
          grep -q 'ELF32' build-xenon/elf-header.txt
          grep -q 'PowerPC' build-xenon/elf-header.txt
          sha256sum build-xenon/shining_saturn_bootstrap.elf32 | tee build-xenon/build-sha256.txt

      - name: Upload Xenon ELF32 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-Xenon-ELF32
          path: |
            prepared-source/${{ needs.prepare-source.outputs.source_dir }}/build-xenon/shining_saturn_bootstrap.elf32
            prepared-source/${{ needs.prepare-source.outputs.source_dir }}/build-xenon/build-sha256.txt
          if-no-files-found: error
          retention-days: 14

  package-xex:
    needs: build-xenon-elf32
    if: needs.build-xenon-elf32.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versioned repository files
        uses: actions/checkout@v4
        with:
          path: repo-source

      - name: Download verified ELF32
        uses: actions/download-artifact@v4
        with:
          name: ShiningSaturn360-Xenon-ELF32
          path: input-elf

      - name: Fetch pinned ELF-to-XEX packer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xex-tools
          base="https://raw.githubusercontent.com/Team-Resurgent/RXDK360/ca06a4db2bc91a44cecfa1f2895adb8f23e91ba3/tools"
          curl --fail --location --silent --show-error "$base/elf2xex.py" -o xex-tools/elf2xex.py
          curl --fail --location --silent --show-error "$base/xex_debugsign.py" -o xex-tools/xex_debugsign.py
          curl --fail --location --silent --show-error "$base/_aes_fallback.py" -o xex-tools/_aes_fallback.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("xex-tools/elf2xex.py")
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "if base_override is not None and base_override != load_base:")
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "# resolve any import records: each is a library plus ELF symbol names whose")
          replacement = [
              "    if base_override is not None:",
              "        if base_override > load_base:",
              "            sys.exit(f\"requested base 0x{base_override:08X} is above ELF load base 0x{load_base:08X}\")",
              "        if entry < base_override or any(s.vaddr < base_override for s in sections):",
              "            sys.exit(\"requested base is above an ELF section or entry point\")",
              "        # Preserve the lower image base so the XEX header has room before .text.",
              "        load_base = base_override",
              "",
          ]
          p.write_text("\n".join(lines[:start] + replacement + lines[end:]) + "\n")
          PY
          python3 -m py_compile xex-tools/elf2xex.py xex-tools/xex_debugsign.py xex-tools/_aes_fallback.py
          sha256sum xex-tools/*.py | tee xex-tools-sha256.txt

      - name: Convert ELF32 to default.xex
        shell: bash
        run: |
          set -euo pipefail
          elf="$(find input-elf -type f -name '*.elf32' -print -quit)"
          test -n "$elf"
          test -s "$elf"
          python3 - "$elf" <<'PY'
          import struct, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          b = p.read_bytes()
          if b[:4] != bytes((0x7F, 0x45, 0x4C, 0x46)) or b[4] != 1 or b[5] != 2:
              raise SystemExit("expected ELF32 big-endian input")
          machine = struct.unpack_from(">H", b, 18)[0]
          entry, phoff = struct.unpack_from(">II", b, 24)
          phentsize, phnum = struct.unpack_from(">HH", b, 42)
          if machine != 20:
              raise SystemExit(f"expected PowerPC ELF machine 20, got {machine}")
          if phentsize < 32 or phoff + phentsize * phnum > len(b):
              raise SystemExit("invalid ELF program-header table")
          loads = []
          for i in range(phnum):
              off = phoff + i * phentsize
              typ, file_off, vaddr, paddr, filesz, memsz, flags, align = struct.unpack_from(">IIIIIIII", b, off)
              if typ != 1:
                  continue
              if filesz > memsz or file_off + filesz > len(b) or vaddr + memsz > 0x100000000:
                  raise SystemExit(f"invalid PT_LOAD segment #{i}")
              loads.append((vaddr, vaddr + memsz, flags, filesz, memsz))
          if not loads:
              raise SystemExit("ELF has no PT_LOAD segments")
          if not any(lo <= entry < hi and flags & 1 for lo, hi, flags, _, _ in loads):
              raise SystemExit(f"ELF entry 0x{entry:08X} is not in an executable PT_LOAD segment")
          print(f"ELF load audit passed: entry=0x{entry:08X}; PT_LOAD segments={len(loads)}")
          PY
          python3 xex-tools/elf2xex.py "$elf" --base 0x1000 -o default.xex 2>&1 | tee xex-packaging.log
          grep -q 'pages:' xex-packaging.log
          if grep -Eiq 'shares a page|mixed[- ]permission|page.*(CODE|RWDATA).*(overlap|conflict)' xex-packaging.log; then
            echo "XEX page-permission audit failed" >&2
            exit 1
          fi
          test -s default.xex
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("default.xex")
          b = p.read_bytes()
          if b[:4] != b"XEX2":
              raise SystemExit("output does not have XEX2 magic")
          basefile_off = struct.unpack_from(">I", b, 8)[0]
          sec_off = struct.unpack_from(">I", b, 16)[0]
          entry_count = struct.unpack_from(">I", b, 20)[0]
          if basefile_off <= 0x18 or basefile_off >= len(b):
              raise SystemExit("XEX basefile offset is outside the file")
          if sec_off < 0x18 or sec_off + 0x184 > basefile_off:
              raise SystemExit("XEX security-info offset is invalid")
          sec_size, image_size = struct.unpack_from(">II", b, sec_off)
          if sec_size < 0x184 or sec_off + sec_size > basefile_off:
              raise SystemExit("XEX security-info block exceeds header region")
          if image_size <= 0 or basefile_off + image_size != len(b):
              raise SystemExit("XEX image size does not match basefile extent")
          if entry_count == 0:
              raise SystemExit("XEX optional-header directory is empty")
          # The basefile is encrypted by the debug-sign pass, so its bytes must not
          # be tested for plaintext MZ/PE magic after signing/encryption.
          print(f"XEX2 structural checks passed: {len(b)} bytes; basefile offset 0x{basefile_off:X}; image size {image_size}; optional headers {entry_count}")
          PY
          sha256sum default.xex | tee default-xex-sha256.txt

      - name: Assemble current version ZIP
        shell: bash
        run: |
          set -euo pipefail
          package="ShiningSaturn360_v0.41b"
          mkdir -p "$package/src/saturn" "$package/tests"
          cp repo-source/src/saturn/sh2_core.hpp repo-source/src/saturn/sh2_core.cpp repo-source/src/saturn/memory_bus.hpp repo-source/src/saturn/memory_bus.cpp repo-source/src/saturn/game_library.hpp repo-source/src/saturn/game_library.cpp repo-source/src/saturn/menu_music.hpp repo-source/src/saturn/menu_music.cpp repo-source/src/saturn/rom_scanner.hpp repo-source/src/saturn/rom_scanner.cpp repo-source/src/saturn/settings.hpp repo-source/src/saturn/settings.cpp "$package/src/saturn/"
          cp repo-source/tests/test_sh2_core.cpp repo-source/tests/test_memory_bus.cpp repo-source/tests/test_game_library.cpp repo-source/tests/test_menu_music.cpp repo-source/tests/test_rom_scanner.cpp repo-source/tests/test_settings.cpp repo-source/tests/run-sh2-core-tests.sh "$package/tests/"
          cp repo-source/README.md "$package/"
          cp repo-source/VERSION "$package/"
          cp repo-source/VERSION_v0.41b.md "$package/"
          cp repo-source/LICENSE "$package/"
          cp repo-source/ShiningSaturn360_v0.39b_repo_update.zip "$package/"
          cp repo-source/ShiningSaturn360_v0.39b_source_audit_patch.zip "$package/"
          cp repo-source/ShiningSaturn360_v0_25b_source.zip "$package/"
          cp repo-source/ShiningSaturn360_v0_26b_cmp_eq_regression.zip "$package/"
          cp default.xex default-xex-sha256.txt xex-tools-sha256.txt xex-packaging.log "$package/"
          cat > "$package/LEIA-ME-ANTES.txt" <<'EOF'
          Shining Saturn 360 v0.41b — pacote experimental
          
          Este pacote inclui o bootstrap default.xex gerado pelo GitHub Actions,
          metadados da versão e arquivos ZIP de código-fonte legados preservados.
          
          A geração e a auditoria estrutural não comprovam inicialização em Xbox 360
          real nem execução de jogos Sega Saturn. O núcleo completo de emulação
          e a compatibilidade com jogos não foram demonstrados.
          EOF
          sha256sum "$package/default.xex" > "$package/default-xex-sha256.txt"
          zip -qr "ShiningSaturn360_v0.41b.zip" "$package"
          sha256sum "ShiningSaturn360_v0.41b.zip" | tee "ShiningSaturn360_v0.41b.zip.sha256"

      - name: Upload complete version ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-v0.41b-ZIP
          path: |
            ShiningSaturn360_v0.41b.zip
            ShiningSaturn360_v0.41b.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload default.xex
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiningSaturn360-default-XEX
          path: |
            default.xex
            default-xex-sha256.txt
            xex-tools-sha256.txt
            xex-packaging.log
          if-no-files-found: error
          retention-days: 14

  report-no-makefile:
    needs: prepare-source
    if: needs.prepare-source.outputs.has_makefile != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain next blocker
        shell: bash
        run: |
          {
            echo "## Build not started"
            echo "The source archives were inspected and extracted, but no Makefile was found. A genuine build cannot be inferred safely without actual project build instructions."
          } >> "$GITHUB_STEP_SUMMARY"
